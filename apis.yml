aid: juvo
name: Juvo
description: >-
  Juvo is a San Francisco based fintech company, founded in 2014, that provides Financial Identity
  as a Service (FiDaaS). In partnership with mobile network operators, Juvo uses data science, machine
  learning, and game mechanics to analyze anonymous prepaid mobile subscriber behavior and build
  proprietary Identity Scores for the roughly 68% of adults worldwide who lack a formal credit history.
  Its Identity Stack exposes an API for carriers to derive customer analytics and insights, and powers
  airtime lending and cash-loan products. Juvo has built over 150 million financial profiles and works
  with operators and partners including Mastercard, Claro, T-Mobile, Vivo, and TIM across Latin America
  and beyond. Developer documentation is published on a Stoplight-hosted portal at developers.juvo.com.
